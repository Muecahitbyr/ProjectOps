# Statischer File-Server fuer das Vite-Production-Bundle (siehe Dockerfile).
# Enthaelt KEINE Proxy-Logik fuer /api oder /ws - das uebernimmt der separate
# Reverse-Proxy-Container (deploy/nginx/reverse-proxy.conf), der diesen
# Service unter "frontend:80" anspricht.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gehashte Asset-Dateinamen (Vite) aendern sich bei jedem Content-Wechsel
    # - unbegrenzt cachebar.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-Fallback: React Router uebernimmt das Routing client-seitig, jede
    # unbekannte Pfad-Anfrage bekommt weiterhin index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
