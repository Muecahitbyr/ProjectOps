# Auftragspunkt 7 "Deployment Vorbereitung" (Phase 10). Fuenf Services:
# postgres (Datenbank), backend (Express/WebSocket), frontend (statisches
# Vite-Bundle hinter eigenem nginx), reverse-proxy (einziger nach aussen
# exponierter Service, routet /, /api, /ws - siehe deploy/nginx/reverse-proxy.conf),
# scraper (externer Google-Maps-Scraper fuer "Kunden Finden", NUR intern
# erreichbar - kein Port-Publishing, kein Reverse-Proxy-Eintrag, siehe dort).
#
# Nutzung:
#   cp .env.production.example .env.production   # ausfuellen, siehe Kommentare dort
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
#
# WICHTIG: --env-file .env.production ist erforderlich, nicht optional. Ohne
# dieses Flag liest Compose fuer die ${VAR}-Interpolationen unten (POSTGRES_
# PASSWORD, CORS_ORIGIN, ...) automatisch eine eventuell vorhandene .env im
# Projektverzeichnis (die lokale Development-Konfiguration!) statt
# .env.production - das wuerde die Produktionsdatenbank z.B. mit dem
# schwachen Dev-Default-Passwort statt dem eigenen starken Passwort
# initialisieren. env_file: bei "backend" unten deckt nur die Container-
# Umgebungsvariablen ab, nicht diese YAML-Interpolationen - beides wird
# gebraucht.
#
# Der bestehende docker-compose.yml (nur Postgres, fuer lokale Entwicklung
# mit `npm run dev`) bleibt unveraendert bestehen.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env.production gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-projectops}
    volumes:
      - projectops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectops} -d ${POSTGRES_DB:-projectops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [projectops]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-projectops}
      # Unterpfad-Deployment (z.B. "/office", siehe VITE_BASE_PATH weiter
      # unten) - haelt den Refresh-Token-Cookie-Pfad (auth.config.ts) in
      # Sync mit dem, was der Browser tatsaechlich anfragt. Leer im
      # Normalfall (Root-Deployment).
      PUBLIC_PATH_PREFIX: ${VITE_BASE_PATH:-}
      # "Kunden Finden" - der Scraper-Service ist nur im internen
      # projectops-Netzwerk erreichbar, per Docker-DNS unter seinem
      # Servicenamen "scraper" (siehe Service unten). Lokal (ohne diesen
      # Compose-Service) faellt der Code auf http://localhost:8080 zurueck,
      # siehe src/core/customer-finder-scraper.ts.
      SCRAPER_BASE_URL: http://scraper:8080
    # Feste, oeffentliche DNS-Server statt Dockers Default (der intern an den
    # systemd-resolved-Stub des Hosts, 127.0.0.53, weiterreicht) - dieser
    # Stub hing am 2026-09-14 mehrfach fuer 1-2 Minuten (dockerd-Log:
    # "[resolver] failed to query external DNS server ... i/o timeout"),
    # wodurch ALLE ausgehenden Checks (Firebase, countriesnow.space, CartoDB,
    # iTunes, bayar-solutions.de) gleichzeitig scheinbar gleichzeitig
    # ausfielen, obwohl kein echter Ausfall vorlag - reine DNS-Aufloesung im
    # Backend-Container, nicht die eigentlichen Dienste.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [projectops]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leer = relative /api-Pfade, das Frontend wird ueber denselben Host
        # wie das Backend ausgeliefert (siehe reverse-proxy). Nur setzen, wenn
        # das Frontend tatsaechlich unter einer anderen Origin als das
        # Backend laeuft.
        VITE_API_URL: ${VITE_API_URL:-${VITE_BASE_PATH:-}}
        # Unterpfad-Deployment (z.B. "/office", falls die App per Rewrite
        # unter einem Pfad statt am Domain-Root ausgeliefert wird) - steuert
        # Router-Basename + Vite-Asset-Praefix (vite.config.ts). Leer im
        # Normalfall.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [projectops]

  # "Kunden Finden" (Nutzerwunsch) - fertiges Upstream-Image, kein eigener
  # Build. KEIN Port-Publishing (im Gegensatz zum lokalen Setup des
  # eigenstaendigen Scraper-Repos, das 127.0.0.1:8080 bindet) - hier reicht
  # die Erreichbarkeit ueber das interne Docker-Netzwerk, das Backend ruft
  # http://scraper:8080 auf (siehe SCRAPER_BASE_URL oben). Kein Auth im
  # Image (siehe Kit-Repo .env.example-Kommentar) - die fehlende externe
  # Erreichbarkeit IST die Sicherheitsgrenze, genau wie dort per
  # 127.0.0.1-Bindung.
  scraper:
    # v1.15.0 (urspruenglich aus dem Kit-Repo uebernommen) ist kaputt: der
    # darin gepinnte Playwright-Treiber (playwright-1.57.0) wurde von
    # Microsofts CDN entfernt, jeder Job haengt seither bei "working" fest
    # (siehe dockerd/Container-Logs: "404 Not Found ... playwright-1.57.0-
    # linux.zip"), live verifiziert waehrend der lokalen Entwicklung. v1.18.0
    # laedt einen aktuellen, noch verfuegbaren Treiber und wurde lokal
    # erfolgreich End-to-End getestet.
    image: gosom/google-maps-scraper:v1.18.0
    container_name: projectops-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    volumes:
      - projectops-scraper-data:/gmapsdata
      - projectops-scraper-cache:/opt
    networks: [projectops]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks: [projectops]

networks:
  projectops:

volumes:
  projectops-postgres-data:
  projectops-scraper-data:
  projectops-scraper-cache:
