# Auftragspunkt 8 "Reverse Proxy" (Phase 10). Einziger von aussen erreichbarer
# Service in docker-compose.production.yml - routet:
#   /       -> frontend-Container (statisches Vite-Bundle, siehe frontend/nginx.conf)
#   /api    -> backend-Container (Express)
#   /ws     -> backend-Container (WebSocket-Upgrade)
#
# TLS wird direkt hier terminiert (echtes Let's-Encrypt-Zertifikat via
# certbot, siehe deploy/nginx/certs-Mount in docker-compose.production.yml) -
# Port 80 liefert nur noch einen Redirect auf https. Dieser Server ist ein
# reiner interner Origin hinter einer externen Rewrite-Regel (z.B. Vercel
# "rewrites" auf einem Kundendomain-Pfad wie /office) - server_name ist
# deshalb die technische Origin-Domain, nicht die oeffentliche Nutzer-URL.

upstream projectops_frontend {
    server frontend:80;
}

upstream projectops_backend {
    server backend:4000;
}

server {
    listen 80;
    server_name ops-origin.bayar-solutions.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ops-origin.bayar-solutions.de;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Grosszuegiges Zeitlimit fuer lang lebende WebSocket-Verbindungen -
    # Standard-nginx-Werte (60s) wuerden aktive Verbindungen sonst kappen.
    proxy_read_timeout 3600s;

    location /api/ {
        proxy_pass http://projectops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://projectops_backend;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://projectops_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://projectops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
